<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>瀵掗湝鐮寸敳宸ュ叿 - 鍙戝竷鏂扮増鏈?/title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Microsoft YaHei UI',sans-serif; background:#F0F2F5; min-height:100vh; }
.overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:#FFFFFF; display:flex; align-items:center; justify-content:center; z-index:999; }
.login-box { background:#FFF; border:1px solid #E2E6ED; border-radius:12px; padding:32px; width:340px; }
.login-box h2 { text-align:center; margin-bottom:20px; color:#1B2231; font-size:18px; }
input { width:100%; padding:12px 14px; border:1.5px solid #D0D5DD; border-radius:8px; font-size:14px; margin-bottom:12px; }
input:focus { outline:none; border-color:#2F6FED; }
.btn { width:100%; padding:12px; border-radius:8px; border:none; font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
.btn-primary { background:#2F6FED; color:#FFF; }
.btn-primary:hover { background:#4285F4; }
.msg { padding:10px; border-radius:8px; margin-top:10px; font-size:13px; display:none; }
.msg-ok { background:#F0FDF4; color:#16A34A; display:block; }
.msg-err { background:#FEF2F2; color:#EF4444; display:block; }
.panel { display:none; max-width:640px; margin:32px auto; padding:0 20px; }
.header { background:#FFF; border-bottom:1px solid #E2E6ED; padding:16px 24px; margin-bottom:24px; display:flex; align-items:center; }
.header h1 { font-size:18px; color:#1B2231; flex:1; }
.header .badge { background:#F0FDF4; color:#16A34A; padding:4px 12px; border-radius:12px; font-size:12px; font-weight:600; }
.card { background:#FFF; border:1px solid #E2E6ED; border-radius:12px; padding:24px; margin-bottom:20px; }
.card h2 { font-size:15px; color:#1B2231; margin-bottom:16px; }
textarea { width:100%; padding:12px 14px; border:1.5px solid #D0D5DD; border-radius:8px; font-size:14px; margin-bottom:12px; height:80px; resize:vertical; font-family:inherit; }
textarea:focus { outline:none; border-color:#2F6FED; }
label { display:block; font-size:13px; color:#6B7280; font-weight:600; margin-bottom:6px; }
table { width:100%; border-collapse:collapse; }
th, td { text-align:left; padding:8px 10px; border-bottom:1px solid #F0F2F5; font-size:13px; color:#1B2231; }
th { background:#F7F8FC; color:#6B7280; font-weight:600; font-size:12px; }
.badge-blue { background:#EBF0FE; color:#2F6FED; padding:2px 10px; border-radius:10px; font-size:11px; font-weight:600; }
</style>
</head>
<body>
<!-- Login -->
<div class="overlay" id="overlay">
<div class="login-box">
<h2>绠＄悊鍚庡彴</h2>
<input type="password" id="pass" placeholder="绠＄悊鍛樺瘑鐮? onkeydown="if(event.key==='Enter')login()">
<button class="btn btn-primary" onclick="login()">鐧?褰?/button>
<div class="msg" id="msg"></div>
</div>
</div>

<!-- Panel -->
<div class="panel" id="panel">
<div class="header">
<h1>馃摝 鍙戝竷鏂扮増鏈?/h1>
<div class="badge">鈼?鍦ㄧ嚎</div>
</div>

<div class="card">
<h2>鍙戝竷鏂扮増鏈?/h2>
<label>鐗堟湰鍙?/label>
<input type="text" id="ver" placeholder="濡?1.1.0">
<label>涓嬭浇閾炬帴</label>
<input type="text" id="url" placeholder="http://xxx/瀵掗湝娉ㄥ叆宸ュ叿.exe">
<label>鏇存柊鏃ュ織</label>
<textarea id="log" placeholder="淇浜?../鏂板浜?.."></textarea>
<button class="btn btn-primary" onclick="push()">鍙?甯?/button>
<div class="msg" id="pmsg"></div>
</div>

<div class="card">
<h2>鍘嗗彶鐗堟湰</h2>
<button class="btn btn-primary" style="width:auto;padding:8px 20px;margin-bottom:12px;" onclick="load()">鍒锋柊</button>
<table>
<thead><tr><th>鐗堟湰</th><th>鏇存柊鍐呭</th><th>鏃堕棿</th></tr></thead>
<tbody id="tbody"></tbody>
</table>
</div>
</div>

<script>
function login() {
    if (document.getElementById('pass').value === 'hanshuang2026') {
        document.getElementById('overlay').style.display = 'none';
        document.getElementById('panel').style.display = 'block';
        load();
    } else {
        const m = document.getElementById('msg');
        m.className = 'msg msg-err'; m.textContent = '瀵嗙爜閿欒';
    }
}
async function push() {
    const v = document.getElementById('ver').value;
    if (!v) { const m=document.getElementById('pmsg'); m.className='msg msg-err'; m.textContent='璇疯緭鍏ョ増鏈彿'; return; }
    const body = new URLSearchParams({ version:v, download_url:document.getElementById('url').value, changelog:document.getElementById('log').value });
    const r = await fetch('/api/admin/push_version', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded','X-Admin-Key':document.getElementById('pass').value}, body:body.toString() });
    const d = await r.json();
    const m = document.getElementById('pmsg');
    if (d.success) { m.className='msg msg-ok'; m.textContent='鍙戝竷鎴愬姛锛佸鎴风浼氳嚜鍔ㄦ娴嬪埌鏇存柊'; document.getElementById('ver').value=''; document.getElementById('url').value=''; document.getElementById('log').value=''; load(); }
    else { m.className='msg msg-err'; m.textContent='鍙戝竷澶辫触'; }
}
async function load() {
    const r = await fetch('/api/admin/versions', { headers:{'X-Admin-Key':document.getElementById('pass').value} });
    const d = await r.json();
    const tb = document.getElementById('tbody');
    tb.innerHTML = '';
    (d.versions||[]).forEach(v => {
        tb.innerHTML += `<tr><td><span class="badge-blue">${v.version}</span></td><td>${v.changelog||'-'}</td><td>${v.created_at}</td></tr>`;
    });
}
</script>
</body>
</html>
